# CI — doc dono: docs/07-qualidade-ci.md §3
# Pipeline único em PR e push em main; PR só mergea com CI verde.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flutter:
    # Projeto Flutter nasce na F3-T01 (docs/14); etapas ativas quando existir pubspec.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -f pubspec.yaml ]; then
            echo "flutter=enabled" >> "$GITHUB_OUTPUT"
          else
            echo "flutter=skipped" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.flutter == 'enabled'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5  # pinado ao SDK do dev — formatter de versões novas diverge
      - if: steps.check.outputs.flutter == 'enabled'
        run: dart format --set-exit-if-changed .
      - if: steps.check.outputs.flutter == 'enabled'
        run: flutter analyze
      - if: steps.check.outputs.flutter == 'enabled'
        run: flutter test
      - if: steps.check.outputs.flutter == 'enabled'
        run: >-
          flutter build web --release
          --dart-define=SUPABASE_URL=https://exemplo.supabase.co
          --dart-define=SUPABASE_ANON_KEY=teste
      - if: steps.check.outputs.flutter == 'enabled'
        run: flutter build apk --debug --flavor prod
      - if: steps.check.outputs.flutter == 'enabled'
        run: flutter build apk --debug --flavor lite

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0  # pinado ao CLI do dev
      - name: Inicia stack local (edge runtime incluído)
        run: supabase start -x studio -x mailpit -x logflare -x vector -x imgproxy -x storage-api
      - name: Aplica migrations (db reset)
        run: supabase db reset
      - name: Testes RLS de negação e positivos (02 §5)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/rls_tests.sql
      - name: Testes de exclusão de conta (06 §3.3.1)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/excluir_conta_tests.sql
      - name: Testes do aceite de convite (08 §3.1)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/aceitar_convite_tests.sql
      - name: Testes da transferência de dono (08 §6)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/transferir_dono_tests.sql
      - name: Testes do preço do item (01 §4.3)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/preco_item_tests.sql
      - name: Testes do orçamento da lista (01 §4.1)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/orcamento_lista_tests.sql
      - name: Testes de arquivar listas (01 §4.1)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/arquivar_listas_tests.sql
      - name: Testes de convite por e-mail (08 §4)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/convites_email_tests.sql
      - name: Testes de tokens de push (02 §5)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/push_tokens_tests.sql
      - name: Testes de notificação push (01 §7)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/notificar_push_tests.sql
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Testes da Edge Function enviar-push (07 §1)
        working-directory: supabase/functions/enviar-push
        run: deno test --allow-env
      - name: Teste de Realtime (01 §7, 02 §5 P-05)
        working-directory: supabase/tests
        run: |
          # Chaves do stack local. `>> $GITHUB_ENV` NÃO vale para este step
          # (só a partir do próximo), então exportamos no próprio shell.
          set -a
          eval "$(supabase status -o env | sed 's/^/export /; s/"//g')"
          set +a
          if [ -z "$SERVICE_ROLE_KEY" ] || [ -z "$ANON_KEY" ]; then
            echo "chaves do stack não encontradas"; supabase status -o env; exit 1
          fi
          npm ci
          # O tenant do Realtime reconecta ao banco por alguns segundos após o
          # `supabase start`/reset — a 1ª roda cai com CLOSED (R-23, infra do
          # stack local, não do app). Aguarda o tenant e tenta 2 vezes.
          for i in 1 2; do
            sleep $((i * 15))
            npm test && break
            if [ "$i" = "2" ]; then echo "Realtime falhou 2x"; exit 1; fi
          done
      # Fase 4+: sync tests no job flutter

  desktop:
    # Valida os builds desktop (F18-T03, ADR-012). A matriz cobre Linux e
    # Windows; macOS fica fora (runner macOS é 10x mais caro).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            comando: flutter build linux
          - os: windows-latest
            comando: flutter build windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5  # pinado ao SDK do dev
      - if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libcurl4-openssl-dev libssl-dev
      - run: ${{ matrix.comando }} --dart-define=SUPABASE_URL=https://exemplo.supabase.co --dart-define=SUPABASE_ANON_KEY=teste
