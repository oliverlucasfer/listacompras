# CI — doc dono: docs/07-qualidade-ci.md §3
# Pipeline único em PR e push em main; PR só mergea com CI verde.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flutter:
    # Projeto Flutter nasce na F3-T01 (docs/14); etapas ativas quando existir pubspec.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f pubspec.yaml ]; then
            echo "flutter=enabled" >> "$GITHUB_OUTPUT"
          else
            echo "flutter=skipped" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.flutter == 'enabled'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5  # pinado ao SDK do dev — formatter de versões novas diverge
      - if: steps.check.outputs.flutter == 'enabled'
        run: dart format --set-exit-if-changed .
      - if: steps.check.outputs.flutter == 'enabled'
        run: flutter analyze
      - if: steps.check.outputs.flutter == 'enabled'
        run: flutter test

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0  # pinado ao CLI do dev — v2.117 não emite SERVICE_ROLE_KEY no status -o env
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Inicia stack local (edge runtime incluído para e2e das functions)
        run: supabase start -x studio -x mailpit -x logflare -x vector -x imgproxy -x storage-api
      - name: Aplica migrations (db reset)
        run: supabase db reset
      - name: Testes RLS de negação e positivos (02 §5)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/rls_tests.sql
      - name: Testes de exclusão de conta (06 §3.3.1)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/excluir_conta_tests.sql
      - name: Testes do aceite de convite (08 §3.1)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/aceitar_convite_tests.sql
      - name: Testes unitários das Edge Functions (deno)
        run: deno test --allow-env supabase/functions/parse-lista/
      - name: Testes e2e do contrato parse-lista (cenários sem Gemini)
        run: |
          # enable_confirmations=true (F3) exige usuários já confirmados via Admin API;
          # SERVICE_ROLE_KEY local = chave de ambiente de teste (07 §3), nunca produção.
          # 2>&1: o status pode emitir as vars pelo stderr. GITHUB_ENV só vale para
          # steps subsequentes — o node roda no mesmo step, então usamos shell direto.
          supabase status -o env 2>&1 | grep -E '^(export )?(API_URL|SERVICE_ROLE_KEY)=' | sed -E 's/^export //; s/"//g; s/^/export /' > /tmp/sb_env.sh
          . /tmp/sb_env.sh
          npm ci --prefix supabase/tests
          node supabase/tests/parse_lista_e2e.mjs --sem-gemini
      # Fase 4+: deno test de novas functions, sync tests no job flutter
