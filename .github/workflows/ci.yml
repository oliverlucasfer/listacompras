# CI — doc dono: docs/07-qualidade-ci.md §3
# Pipeline único em PR e push em main; PR só mergea com CI verde.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flutter:
    # Projeto Flutter nasce na F3-T01 (docs/14); etapas ativas quando existir pubspec.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -f pubspec.yaml ]; then
            echo "flutter=enabled" >> "$GITHUB_OUTPUT"
          else
            echo "flutter=skipped" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.flutter == 'enabled'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5  # pinado ao SDK do dev — formatter de versões novas diverge
      - if: steps.check.outputs.flutter == 'enabled'
        run: dart format --set-exit-if-changed .
      - if: steps.check.outputs.flutter == 'enabled'
        run: flutter analyze
      - if: steps.check.outputs.flutter == 'enabled'
        run: flutter test
      - if: steps.check.outputs.flutter == 'enabled'
        run: >-
          flutter build web --release
          --dart-define=SUPABASE_URL=https://exemplo.supabase.co
          --dart-define=SUPABASE_ANON_KEY=teste

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0  # pinado ao CLI do dev
      - name: Inicia stack local (edge runtime incluído)
        run: supabase start -x studio -x mailpit -x logflare -x vector -x imgproxy -x storage-api
      - name: Aplica migrations (db reset)
        run: supabase db reset
      - name: Testes RLS de negação e positivos (02 §5)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/rls_tests.sql
      - name: Testes de exclusão de conta (06 §3.3.1)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/excluir_conta_tests.sql
      - name: Testes do aceite de convite (08 §3.1)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/aceitar_convite_tests.sql
      # Fase 4+: sync tests no job flutter

  desktop:
    # Valida os builds desktop (F18-T03, ADR-012). A matriz cobre Linux e
    # Windows; macOS fica fora (runner macOS é 10x mais caro).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            comando: flutter build linux
          - os: windows-latest
            comando: flutter build windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5  # pinado ao SDK do dev
      - if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: ${{ matrix.comando }} --dart-define=SUPABASE_URL=https://exemplo.supabase.co --dart-define=SUPABASE_ANON_KEY=teste
